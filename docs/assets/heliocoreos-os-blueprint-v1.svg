  <rect x="335" y="760" width="300" height="170" rx="8" class="panel"/><text x="355" y="788" class="ink h2">Document Metadata</text><text x="355" y="820" class="muted body">Title · Reference · Type · Template</text><text x="355" y="846" class="muted body">Related object · Owner · Approval route</text><text x="355" y="872" class="muted body">Version · Revision · Issue and expiry dates</text><text x="355" y="898" class="muted body">Tags · Access · Visibility · Audit history</text>
  <rect x="650" y="760" width="300" height="170" rx="8" class="panel"/><text x="670" y="788" class="ink h2">Core Constitution</text><text x="670" y="820" class="green body">Protected and project-independent</text><text x="670" y="846" class="muted body">Identity · tenancy · navigation · states</text><text x="670" y="872" class="muted body">documents · approvals · audit · security</text><text x="670" y="898" class="muted body">May change only through a constitutional amendment.</text>
  <rect x="965" y="760" width="300" height="170" rx="8" class="panel"/><text x="985" y="788" class="ink h2">Project Additions</text><text x="985" y="820" class="blue body">HelioCoreOS Solar EPC Profile</text><text x="985" y="846" class="muted body">Opportunity · readiness · PV/BESS proposal</text><text x="985" y="872" class="muted body">survey · design · procurement · installation</text><text x="985" y="898" class="muted body">Every addition references the core it implements.</text>
  <rect x="1280" y="760" width="300" height="170" rx="8" class="panel"/><text x="1300" y="788" class="ink h2">Non-Negotiable Principles</text><text x="1300" y="820" class="muted body">Collect only what is needed</text><text x="1300" y="846" class="muted body">Always show location and next action</text><text x="1300" y="872" class="muted body">No silent failure or destructive overwrite</text><text x="1300" y="898" class="muted body">One source of truth and complete auditability</text>

