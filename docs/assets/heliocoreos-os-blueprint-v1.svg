  <rect x="1080" y="330" width="500" height="125" rx="8" class="panel"/><text x="1100" y="357" class="ink h2">Universal State Model</text><text x="1100" y="402" class="muted body">Created → Draft → Pending → In Progress → Review → Approved → Completed → Archived</text><circle cx="1115" cy="425" r="8" fill="#9aa5b1"/><circle cx="1175" cy="425" r="8" fill="#315fc4"/><circle cx="1235" cy="425" r="8" fill="#f4a300"/><circle cx="1295" cy="425" r="8" fill="#315fc4"/><circle cx="1355" cy="425" r="8" fill="#7252aa"/><circle cx="1415" cy="425" r="8" fill="#3a9a55"/><circle cx="1475" cy="425" r="8" fill="#3a9a55"/><circle cx="1535" cy="425" r="8" fill="#687582"/>
